apiVersion: apps/v1
kind: Deployment
metadata:
  name: memocare-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memocare-backend
  template:
    metadata:
      labels:
        app: memocare-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/OWNER/memocare-backend:latest
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: memocare-secrets
              key: MONGO_URI
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: memocare-secrets
              key: FRONTEND_URL
---
apiVersion: v1
kind: Service
metadata:
  name: memocare-backend
spec:
  selector:
    app: memocare-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
