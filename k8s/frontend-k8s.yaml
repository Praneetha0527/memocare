apiVersion: apps/v1
kind: Deployment
metadata:
  name: memocare-frontend
  namespace: memocare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memocare-frontend
  template:
    metadata:
      labels:
        app: memocare-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/OWNER/memocare-frontend:latest
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: memocare-frontend
  namespace: memocare
spec:
  type: ClusterIP
  selector:
    app: memocare-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memocare-ingress
  namespace: memocare
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memocare-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: memocare-backend
            port:
              number: 5000
