name: Deploy to EC2 with k3s

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set lower case owner name
      id: set_owner
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_OUTPUT}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ghcr.io/${{ steps.set_owner.outputs.owner }}/memocare-backend:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ steps.set_owner.outputs.owner }}/memocare-frontend:latest
        build-args: |
          VITE_API_URL=http://${{ secrets.EC2_HOST }}/api


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install k3s and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PEM_KEY }}
        script: |
          # Install k3s if not already installed
          if ! command -v kubectl &> /dev/null; then
            echo "Installing k3s..."
            curl -sfL https://get.k3s.io | sh -
            # Wait for k3s to be ready
            sleep 10
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          fi
          
          # Set KUBECONFIG for the current session
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          
          # Create namespace and secrets if they don't exist
          sudo kubectl create namespace memocare --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl create secret generic memocare-secrets \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --from-literal=FRONTEND_URL="http://${{ secrets.EC2_HOST }}" \
            -n memocare --dry-run=client -o yaml | sudo kubectl apply -f -
        
    - name: SCP files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PEM_KEY }}
        source: "k8s/*"
        target: "~/memocare-deploy"

    - name: Final Deploy command
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PEM_KEY }}
        script: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd ~/memocare-deploy/k8s
          # Update OWNER placeholder in manifests with lowercase version
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s/OWNER/$OWNER_LC/g" *.yaml
          # Replace Grafana URL and host placeholders with EC2 host from secrets
          GRAFANA_URL="http://${{ secrets.EC2_HOST }}:32000"
          GRAFANA_HOST="${{ secrets.EC2_HOST }}"
          sed -i "s|REPLACE_GRAFANA_URL|$GRAFANA_URL|g" *.yaml || true
          sed -i "s|REPLACE_GRAFANA_HOST|$GRAFANA_HOST|g" *.yaml || true
          # Cleanup any stale deployments in default namespace to avoid confusion
          sudo kubectl delete deployment memocare-backend memocare-frontend -n default --ignore-not-found
          sudo kubectl delete service memocare-backend memocare-frontend -n default --ignore-not-found
          
          sudo kubectl apply -f .

